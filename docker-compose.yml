services:
  arm:
    build:
      context: .
      dockerfile: Dockerfile
    image: amrsim-arm:latest
    container_name: amr_arm_server
    ports:
      - "8000:8000"
    volumes:
      - ./out:/app/out
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
