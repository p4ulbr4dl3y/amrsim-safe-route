name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Tests & Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Run Backend Unit Tests
        run: uv run pytest -v

      - name: Verify amrsim static check
        run: |
          cd amrsim-participants
          uv run python -m amrsim check ../team_dreamteam_4_0

      - name: Run Smoke Simulation (Scenario 01 Clear)
        run: |
          cd amrsim-participants
          uv run python -m amrsim run scenarios/01_clear.json --controller ../team_dreamteam_4_0/controller.py --seed 1 --report /tmp/test_01.json

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arm/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: arm/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Build Production SPA
        run: npm run build
