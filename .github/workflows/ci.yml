name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Tests & Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Run Backend Unit Tests
        run: uv run pytest -v

      - name: Verify amrsim static check
        run: |
          cd amrsim-participants
          uv run python -m amrsim check ../team_dreamteam_4_0

      - name: Run Smoke Simulation (Scenario 01 Clear)
        run: |
          cd amrsim-participants
          uv run python -m amrsim run scenarios/01_clear.json --controller ../team_dreamteam_4_0/controller.py --seed 1 --report /tmp/test_01.json

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arm/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: arm/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Build Production SPA
        run: npm run build

  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: amrsim-arm:ci
          load: true

      - name: Verify T3 isolation in Docker
        run: |
          docker run --rm amrsim-arm:ci python -m amrsim check team_dreamteam_4_0

      - name: Run Smoke Simulation in Docker
        run: |
          docker run --rm amrsim-arm:ci python -m amrsim run scenarios/01_clear.json --controller team_dreamteam_4_0/controller.py --seed 1 --report /app/out/smoke_ci.json

      - name: Verify ARM Server health check
        run: |
          docker run -d --name test_arm -p 8000:8000 amrsim-arm:ci
          sleep 3
          curl -f http://localhost:8000/api/scenarios || exit 1
          docker stop test_arm

  deploy:
    name: Deploy to Production VPS
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/amrsim-safe-route
            git pull origin main || true
            docker build -t amrsim-arm:latest .
            docker stop amr || true
            docker rm amr || true
            docker run -d --name amr --restart always -p 127.0.0.1:8012:8000 --memory=350m amrsim-arm:latest
            docker image prune -f
            curl -f http://127.0.0.1:8012/api/scenarios > /dev/null

